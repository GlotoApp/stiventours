<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin:0; font-family: 'Poppins', sans-serif; background: #000; }
            iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <!-- full-screen PDF container -->
    <iframe id="pdf-frame" src="" title="Catálogo PDF" class="w-full h-full fixed top-0 left-0"></iframe>
    <!-- floating WhatsApp contact button -->
    <a id="whatsapp-btn" href="#" target="_blank" class="fixed bottom-6 right-6 bg-[#25D366] hover:bg-[#128C7E] text-white px-4 py-2 rounded-full font-bold inline-flex items-center gap-2 z-50">
        <i class="fab fa-whatsapp"></i> Contactar
    </a>

    <script>
    // cargar enlace del PDF desde data.json
    fetch('data.json').then(r=>r.json()).then(data=>{
        const url = data.pdfCatalogo || 'pdf/Experiencias_Stivenm_Tours.pdf';
        const frame = document.getElementById('pdf-frame');
        const btn = document.getElementById('whatsapp-btn');
        if(frame) frame.src = url;
        if(btn) {
            // el número de contacto debe venir desde data.json (campo contact.phone)
            // hacemos limpieza de caracteres no numéricos por si el JSON trae espacios o signos
            let phone = '573228209657'; // valor por defecto si falte en el JSON
            if(data.contact && data.contact.phone) {
                phone = String(data.contact.phone).replace(/[^0-9]/g, '');
            }
            const text = encodeURIComponent('Hola, me gustaría mas información.');
            btn.href = `https://wa.me/${phone}?text=${text}`;
        }
    }).catch(e=>console.error('No se pudo cargar data.json', e));
    </script>
</body>
</html>
